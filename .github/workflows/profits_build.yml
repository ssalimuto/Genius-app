name: Build Ssalimuto Profits APK
on:
  push:
    paths:
      - 'profits/**'
      - '.github/workflows/profits_build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: profits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests and name gate
        run: |
          python tests/name_gate.py
          python tests/test_core.py
          python tests/test_cloud_bot.py
      - name: Install build tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt; fi
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list 2>/dev/null || true
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=5 --fix-missing git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake && break
            echo "apt failed, retrying in 20s"; sleep 20
          done
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: python-for-android v2024.01.21
        run: |
          git clone --depth 1 -b v2024.01.21 https://github.com/kivy/python-for-android.git p4a-src
          sed -i "s#^p4a.branch = .*#p4a.source_dir = $PWD/p4a-src#" buildozer.spec
          grep -n "p4a.source_dir" buildozer.spec
      - name: Stamp version 1.0.${{ github.run_number }}
        run: |
          NV="1.0.$GITHUB_RUN_NUMBER"
          sed -i "s/^version = .*/version = $NV/" buildozer.spec
          sed -i "0,/^VERSION = \"1.0\"/s//VERSION = \"$NV\"/" main.py
          sed -i "0,/^BUILD_NUMBER = \"dev\"/s//BUILD_NUMBER = \"$GITHUB_RUN_NUMBER\"/" main.py
          sed -i "0,/^BUILD_COMMIT = \"dev\"/s//BUILD_COMMIT = \"${GITHUB_SHA::7}\"/" main.py
          grep -q "^VERSION = \"$NV\"" main.py
          grep -m3 -E '^(VERSION|BUILD_NUMBER|BUILD_COMMIT) = ' main.py
          grep '^version = ' buildozer.spec
      - name: Build release APK (unsigned)
        run: yes | buildozer android release
      - name: Check the built APK
        run: |
          ls -l bin/
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          A=$(ls bin/*.apk | head -1)
          "$BT/aapt" dump badging "$A" | grep -E "^package:|uses-permission" | tee /tmp/badging.txt
          grep -q "package: name='org.ssalimuto.profits'" /tmp/badging.txt
          grep -q "versionName='1.0.$GITHUB_RUN_NUMBER'" /tmp/badging.txt
          "$BT/aapt" dump xmltree "$A" AndroidManifest.xml | grep -A2 -i "queries" | head
          mkdir -p out && cp "$A" "out/SsalimutoProfits-1.0.$GITHUB_RUN_NUMBER-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SsalimutoProfits-unsigned
          path: profits/out/*.apk
          retention-days: 14
