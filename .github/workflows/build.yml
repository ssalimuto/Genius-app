name: Build Genius APK
on:
  push:
    paths-ignore:
      - 'ssalimuto/**'
      - '.github/workflows/ssalimuto.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          # GitHub's Azure Ubuntu mirror sometimes fails; use the main Ubuntu servers and retry.
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt; fi
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list 2>/dev/null || true
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=5 --fix-missing git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake && break
            echo "apt failed, retrying in 20s"; sleep 20
          done
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Add Genius app reader (messages, screen, share) to the Android manifest
        run: |
          git clone --depth 1 -b v2024.01.21 https://github.com/kivy/python-for-android.git p4a-src
          python3 -c "p='p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml'; s=open(p).read(); x=open('android_extra/services.xml').read(); assert s.count('</application>')==1; open(p,'w').write(s.replace('</application>', x+'\n    </application>'))"
          sed -i "s#^p4a.source_dir = .*#p4a.source_dir = $GITHUB_WORKSPACE/p4a-src#" buildozer.spec
          grep -n "GeniusNotifListener\|GeniusScreenReader" p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml
          grep -n "p4a.source_dir" buildozer.spec
      - name: Stamp a new version on every build (so phones update themselves)
        run: |
          V=$(grep -m1 '^VERSION = ' main.py | cut -d'"' -f2)
          NV="$V.$GITHUB_RUN_NUMBER"
          sed -i "0,/^VERSION = \"$V\"/s//VERSION = \"$NV\"/" main.py
          sed -i "0,/^version = .*/s//version = $NV/" buildozer.spec
          grep -m1 '^VERSION = ' main.py; grep -m1 '^version = ' buildozer.spec
      - name: Build APK
        run: yes | buildozer android debug
      - name: Prepare quiet update files
        run: |
          VER=$(grep -m1 '^VERSION = ' main.py | cut -d'"' -f2)
          echo "VER=$VER" >> $GITHUB_ENV
          cp main.py bin/genius_live.py
          (cd bin && sha256sum genius_live.py > genius_live.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Genius-APK
          path: bin/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: Genius ${{ env.VER }} (build ${{ github.run_number }})
          make_latest: false
          files: |
            bin/genius_live.py
            bin/genius_live.sha256
      - name: Newest app on one fixed link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls bin/*.apk | head -1)" bin/Genius.apk
          NOTES="Genius for Android, made in Uganda by Ssali Muto. Tap Genius.apk below to download the newest app. After you install it, Genius keeps itself up to date."
          gh release view android >/dev/null 2>&1 || gh release create android --title "Genius for Android (newest)" --notes "$NOTES" --latest
          gh release upload android bin/Genius.apk --clobber
          gh release edit android --title "Genius for Android (newest)" --notes "$NOTES" --latest
      - name: Old shared links get the newest app too
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-links]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/old
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name != "android") | .tag_name as $t | .assets[] | select(.name | endswith(".apk")) | "\($t) \(.name)"' > /tmp/old/list.txt
          cat /tmp/old/list.txt
          while read -r t n; do
            cp bin/Genius.apk "/tmp/old/$n"
            gh release upload "$t" "/tmp/old/$n" --clobber
            rm -f "/tmp/old/$n"
          done < /tmp/old/list.txt

