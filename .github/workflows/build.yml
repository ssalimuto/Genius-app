name: Build Genius APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Genius-APK
          path: bin/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v101.0-build${{ github.run_number }}
          name: Genius 101.0 (build ${{ github.run_number }})
          files: bin/*.apk
