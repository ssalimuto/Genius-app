name: Build Genius APK
on:
  push:
    paths-ignore:
      - 'ssalimuto/**'
      - '.github/workflows/ssalimuto.yml'
      - 'profits/**'
      - 'cloud_bot/**'
      - '.github/workflows/profits_build.yml'
      - '.github/workflows/profits_publish.yml'
      - '.github/workflows/profits_cloud.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Release gate (every promised feature present, no banned names, no raw tracebacks)
        working-directory: ${{ github.workspace }}
        run: |
          python tests/release_gate.py main.py
          python tests/test_answer_quality.py
          python tests/test_updater.py
      - name: Install build tools
        run: |
          # GitHub's Azure Ubuntu mirror sometimes fails; use the main Ubuntu servers and retry.
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo "http://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt; fi
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list 2>/dev/null || true
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=5 --fix-missing git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake && break
            echo "apt failed, retrying in 20s"; sleep 20
          done
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Add Genius app reader (messages, screen, share) to the Android manifest
        run: |
          git clone --depth 1 -b v2024.01.21 https://github.com/kivy/python-for-android.git p4a-src
          python3 -c "p='p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml'; s=open(p).read(); x=open('android_extra/services.xml').read(); assert s.count('</application>')==1; open(p,'w').write(s.replace('</application>', x+'\n    </application>'))"
          sed -i "s#^p4a.source_dir = .*#p4a.source_dir = $GITHUB_WORKSPACE/p4a-src#" buildozer.spec
          grep -n "GeniusNotifListener\|GeniusScreenReader" p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml
          grep -n "p4a.source_dir" buildozer.spec
      - name: Stamp a new version on every build (so phones update themselves)
        run: |
          V=$(grep -m1 '^VERSION = ' main.py | cut -d'"' -f2)
          NV="$V.$GITHUB_RUN_NUMBER"
          sed -i "0,/^VERSION = \"$V\"/s//VERSION = \"$NV\"/" main.py
          sed -i "0,/^BUILD_NUMBER = \"dev\"/s//BUILD_NUMBER = \"$GITHUB_RUN_NUMBER\"/" main.py
          sed -i "0,/^BUILD_COMMIT = \"dev\"/s//BUILD_COMMIT = \"${GITHUB_SHA::7}\"/" main.py
          grep -m3 -E '^(VERSION|BUILD_NUMBER|BUILD_COMMIT) = ' main.py
          grep -q "^BUILD_NUMBER = \"$GITHUB_RUN_NUMBER\"" main.py
      - name: Build the App Maker template (WebView shell -> apk_template.bin)
        run: |
          bash shellapp/build_template.sh apk_template.bin
          ls -l apk_template.bin
      - name: Build APK
        run: yes | buildozer android debug
      - name: Release gate on the built copy
        run: |
          python tests/release_gate.py main.py
          ls -l bin/*.apk
      - name: Sign with the permanent key (only when the key is saved in the repo's Actions secrets)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::No signing key in Actions secrets. The quiet code update is published, but the fixed download link keeps its current app (a random-key app can't install over the phone's copy)."
            exit 0
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > /tmp/upload.jks
          IN="$(ls bin/*.apk | head -1)"
          "$BT/zipalign" -p -f 4 "$IN" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/upload.jks --ks-pass env:KS_PASS --out bin/Genius.apk /tmp/aligned.apk
          rm -f /tmp/upload.jks
          D=$("$BT/apksigner" verify --print-certs bin/Genius.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          test "$D" = "320faeaf8da56b8a0b98148d680af3fb2443499a00f9be853cdad18bf8b019c4"
          echo "SIGNED=1" >> $GITHUB_ENV
      - name: Prepare quiet update files
        run: |
          VER=$(grep -m1 '^VERSION = ' main.py | cut -d'"' -f2)
          echo "VER=$VER" >> $GITHUB_ENV
          cp main.py bin/genius_live.py
          (cd bin && sha256sum genius_live.py > genius_live.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Genius-APK
          path: bin/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: Genius ${{ env.VER }} (build ${{ github.run_number }})
          make_latest: false
          files: |
            bin/genius_live.py
            bin/genius_live.sha256
      - name: Newest app on one fixed link (only a permanent-key app that passed the gate)
        if: success() && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Genius for Android, made in Uganda by Ssali Muto. Tap Genius.apk below to download the newest app. After you install it, Genius keeps itself up to date.

          Version: $VER
          Build: ${{ github.run_number }} (code ${GITHUB_SHA::7})"
          gh release view android >/dev/null 2>&1 || gh release create android --title "Genius for Android (newest)" --notes "$NOTES" --latest
          gh release upload android bin/Genius.apk --clobber
          gh release edit android --title "Genius for Android (newest)" --notes "$NOTES" --latest
      - name: Old shared links get the newest app too
        if: env.SIGNED == '1' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-links]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/old
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name != "android") | .tag_name as $t | .assets[] | select(.name | endswith(".apk")) | "\($t) \(.name)"' > /tmp/old/list.txt
          cat /tmp/old/list.txt
          while read -r t n; do
            cp bin/Genius.apk "/tmp/old/$n"
            gh release upload "$t" "/tmp/old/$n" --clobber
            rm -f "/tmp/old/$n"
          done < /tmp/old/list.txt

