name: Startup check on an Android 11 emulator (32-bit)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch holding the apps to test (empty = the published download links)'
        required: false
        default: ''
      files:
        description: 'Apps to test (tag:asset for links, or file names on the branch)'
        required: false
        default: 'android:Genius.apk ssalimuto-android:SsalimutoAI.apk profits-android:SsalimutoProfits.apk'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          if [ -n "${{ inputs.branch }}" ]; then
            git fetch --depth 1 origin "${{ inputs.branch }}"
            for f in ${{ inputs.files }}; do git show "origin/${{ inputs.branch }}:$f" > "apks/$(basename $f)"; done
          else
            for x in ${{ inputs.files }}; do t=${x%%:*}; a=${x#*:}; gh release download "$t" -p "$a" -D apks --clobber; done
          fi
          ls -l apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold start each app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/startup/startup_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-check
          path: startup_out
