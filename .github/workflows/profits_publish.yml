name: Publish Ssalimuto Profits to its fixed download link
# The app is signed with the permanent key outside GitHub (the key is never in this repo).
# The signed app sits on the branch "profits-signed"; this checks the key and the package,
# then puts it on the fixed link as SsalimutoProfits.apk.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Get the signed app
        run: |
          git fetch --depth 1 origin profits-signed
          mkdir -p signed && git --work-tree=signed checkout origin/profits-signed -- .
          ls -l signed
          test -f signed/SsalimutoProfits.apk
      - name: Check key and package
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          F=signed/SsalimutoProfits.apk
          "$BT/zipalign" -c -p 4 $F
          "$BT/apksigner" verify --verbose $F
          D=$("$BT/apksigner" verify --print-certs $F | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          test "$D" = "320faeaf8da56b8a0b98148d680af3fb2443499a00f9be853cdad18bf8b019c4" || { echo "not signed with the permanent key"; exit 1; }
          "$BT/aapt" dump badging $F | head -1 | tee /tmp/badging
          grep -q "package: name='org.ssalimuto.profits'" /tmp/badging
          V=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" /tmp/badging)
          echo "VER=$V" >> $GITHUB_ENV
          sha256sum $F
      - name: Put it on the fixed link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Ssalimuto Profits for Android. Made by Ssali Muto. Tap SsalimutoProfits.apk below to download the app.

          Trading can lose money. The app starts in practice mode and never asks for your MT5 password.

          Version: $VER"
          gh release view profits-android >/dev/null 2>&1 || gh release create profits-android --title "Ssalimuto Profits for Android" --notes "$NOTES" --latest=false
          gh release upload profits-android signed/SsalimutoProfits.apk --clobber
          gh release edit profits-android --title "Ssalimuto Profits for Android" --notes "$NOTES" --latest=false
